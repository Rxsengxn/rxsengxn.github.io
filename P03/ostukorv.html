    <main>
      <section>
        <div class="container">
          <div class="row">
            <!-- Vasakpoolne osa -->
            <div class="col-lg-6 d-flex align-items-start flex-column">
              <div class="mb-auto p-2">
                <h4>Teie ostukorv</h4>
              </div>
              <div class="mb-auto p-2 row">
                <div class="col-lg-6">
                  <img src="img/stephan-seeber-NzAfGi8XuA4-unsplash.jpg" class="img-fluid rounded-3" alt="saapad">
                </div>
                <div class="col-lg-3">
                  <p>199 &#8364;</p>
                  <p>Ilusad saapad</p>
                  <select class="form-select">
                    <option>0</option>
                    <option selected="selected">1</option>
                    <option>2</option>
                    <option>3</option>
                  </select>
                  <!-- <br /> -->
                </div>
              </div>
              <div class="p-2">
                <p>Tarne: tasuta</p>
                <p>Kokku: 199 &#8364;</p>
              </div>
              <!-- <div class="p-2 mx-auto">
            <a href="#" class="btn btn-primary btn-lg mb-3">Maksma</a>
          </div> -->
            </div>
            <!-- </div> -->
            <div class="col-lg-6">
              <!--Tee ise: korrasta (lisa) ostukorvi vormi nii, et sellel oleks väljad kasutaja andmete jaoks, makse ja tarneviisi valik ning ostukorv oleks kujundatud järgides kasutajaliidese disaini põhimõtteid.-->
              <form>
                <div class="my-5">
                  <label for="nimi" class="form-label">Nimi</label>
                  <input type="text" class="form-control" id="nimi" placeholder="Sisesta oma nimi">
                </div>
                <div class="mb-3">
                  <label for="email" class="form-label">E-mail</label>
                  <input type="email" class="form-control" id="email" placeholder="Sisesta oma e-mail: placeholder@gmail.com">
                </div>
                <div class="mb-3">
                  <label for="aadress" class="form-label">Aadress</label>
                  <input type="text" class="form-control" id="aadress" placeholder="Sisesta oma aadress">
                </div>
                <div class="mb-3">
                  <label for="makseviis" class="form-label">Makseviis</label>
                  <select class="form-select" id="makseviis">
                    <option selected>Vali makseviis</option>
                    <option value="1">Krediitkaart</option>
                    <option value="2">PayPal</option>
                    <option value="3">Pangaülekanne</option>
                  </select>
                </div>
                <div class="mb-3">
                  <label for="tarneviis" class="form-label">Tarneviis</label>
                  <select class="form-select" id="tarneviis">
                    <option selected>Vali tarneviis</option>
                    <option value="1">Kullerteenus</option>
                    <option value="2">Postkontorisse</option>
                    <option value="3">Pakiautomaat</option>
                  </select>
                </div>
                <div class="mb-3">
                  <label for="lisainfo" class="form-label">Lisainfo</label>
                  <textarea class="form-control" id="lisainfo" rows="3"
                    placeholder="Kirjuta siia lisainfo oma tellimuse kohta"></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Esita tellimus</button>
              </form>
            </div>
          </div>
        </div>
      </section>
    </main>
